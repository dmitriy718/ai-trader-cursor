# Trading Bot Configuration

trading:
  enabled: false  # Set to true to enable live trading
  risk_per_trade: 0.02  # 2% risk per trade
  max_position_size_usd: 1000.0
  daily_loss_limit_usd: 100.0
  trade_cooldown_seconds: 300  # 5 minutes between trades on same symbol

scanner:
  interval_seconds: 60  # 1 minute
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - BNBUSDT
    - ADAUSDT
    - DOGEUSDT
    - XRPUSDT
    - LTCUSDT
    - LINKUSDT
    - SHIBUSDT
  
  strategies:
    trend:
      enabled: true
      ema_fast: 5
      ema_slow: 13
      adx_threshold: 25.0
    
    mean_reversion:
      enabled: true
      bollinger_period: 20
      bollinger_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
    
    momentum:
      enabled: true
      rsi_period: 14
      rsi_threshold: 50
      volume_multiplier: 1.5

risk_management:
  adx_chop_threshold: 25.0
  atr_multiplier: 2.0
  trailing_stop_enabled: true
  breakeven_enabled: true
  breakeven_trigger_percent: 0.5
  
  liquidity:
    max_spread_percent: 0.5
    min_book_liquidity_usd: 5000.0
    order_book_imbalance_threshold: 0.3

performance:
  kline_buffer_size: 200
  ram_cache_enabled: true
  historical_warmup_minutes: 120

database:
  path: /app/data/trading_bot.db
  wal_mode: true
  connection_pool_size: 10

api:
  host: 0.0.0.0
  port: 8000
  cors_origins:
    - "*"

logging:
  level: INFO
  file: /app/logs/trading_bot.log
  max_bytes: 10485760  # 10MB
  backup_count: 5

ml:
  model_path: /app/models/price_predictor.tflite
  prediction_window_minutes: 5
  retrain_interval_hours: 24

monitoring:
  health_check_interval_seconds: 30
  metrics_enabled: true
